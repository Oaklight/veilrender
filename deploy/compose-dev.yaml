# Dev instance: Obscura (tier 0) + CloakBrowser (tier 1) on port 7861
services:
  veilrender-dev:
    image: oaklight/veilrender:dev-test
    container_name: veilrender-dev
    restart: unless-stopped
    ports:
      - "7861:7860"
    environment:
      - VEILRENDER_API_TOKEN=${VEILRENDER_API_TOKEN:-changeme}
      - VEILRENDER_RESOURCE_FILTER=true
      - VEILRENDER_OBSCURA=true
      - VEILRENDER_OBSCURA_MAX_CONCURRENT=${VEILRENDER_OBSCURA_MAX_CONCURRENT:-8}
      - VEILRENDER_MAX_CONCURRENT=${VEILRENDER_MAX_CONCURRENT:-3}
      - VEILRENDER_ENGINE_HEADER=true
    volumes:
      - veilrender-dev-data:/data
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  veilrender-dev-data:
