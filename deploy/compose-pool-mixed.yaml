# Mixed pool: VeilRender gateway + Obscura (tier 0) + CloakBrowser + Camoufox (tier 1)
#
# Usage:
#   docker compose -f deploy/compose-pool-mixed.yaml up -d
#   docker compose -f deploy/compose-pool-mixed.yaml up -d --scale obscura-worker=3
#
# Three-engine stealth coverage with two-tier fallback:
#   - Obscura: lightweight Rust browser (tier 0, ~30MB, tries first)
#   - CloakBrowser: stealth Chromium (tier 1, CDP) via Patchright
#   - Camoufox: stealth Firefox (tier 1, Playwright protocol)
#
# Default replicas: 3 Obscura : 1 CloakBrowser : 1 Camoufox
# Obscura is ~30MB per instance vs ~200MB+ for Chromium/Firefox,
# so a higher replica count gives more tier-0 throughput cheaply.

services:
  veilrender:
    image: oaklight/veilrender:gateway
    container_name: veilrender
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - VEILRENDER_API_TOKEN=${VEILRENDER_API_TOKEN:-changeme}
      - VEILRENDER_RESOURCE_FILTER=true
      - VEILRENDER_WORKERS=obscura://obscura-worker:9222,cdp://chromium-worker:9222,playwright://camoufox-worker:1234/ws
      - VEILRENDER_WORKER_MAX_CONCURRENT=${VEILRENDER_WORKER_MAX_CONCURRENT:-5}
      - VEILRENDER_WORKER_HEALTH_INTERVAL=${VEILRENDER_WORKER_HEALTH_INTERVAL:-10}
      - VEILRENDER_ENGINE_HEADER=${VEILRENDER_ENGINE_HEADER:-false}
    volumes:
      - veilrender-data:/data
    depends_on:
      - obscura-worker
      - chromium-worker
      - camoufox-worker
    deploy:
      resources:
        limits:
          memory: 512M

  obscura-worker:
    image: h4ckf0r0day/obscura
    restart: unless-stopped
    command: ["--stealth", "serve", "--port", "9222"]
    deploy:
      replicas: ${OBSCURA_REPLICAS:-3}
      resources:
        limits:
          memory: 256M

  chromium-worker:
    image: cloakhq/cloakbrowser
    restart: unless-stopped
    command: ["cloakserve"]
    deploy:
      replicas: ${CHROMIUM_REPLICAS:-1}
      resources:
        limits:
          memory: 1G

  camoufox-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.camoufox
    restart: unless-stopped
    deploy:
      replicas: ${CAMOUFOX_REPLICAS:-1}
      resources:
        limits:
          memory: 1G

volumes:
  veilrender-data:
