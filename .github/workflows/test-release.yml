name: Test Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to test-release (e.g. 0.6.1.dev1)"
        required: true
        type: string

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify version matches package
        run: |
          PKG_VER=$(python -c "import re; m=re.search(r'__version__\s*=\s*\"(.+?)\"', open('src/veilrender/__init__.py').read()); print(m.group(1))")
          echo "Package version: $PKG_VER"
          echo "Requested version: ${{ inputs.version }}"
          [ "$PKG_VER" = "${{ inputs.version }}" ] || \
            (echo "::error::Version mismatch: __init__.py has $PKG_VER but release requested ${{ inputs.version }}"; exit 1)

      - name: Build wheel + sdist
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  docker:
    needs: build-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev images
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          platforms: linux/amd64
          push: true
          tags: |
            oaklight/veilrender:${{ inputs.version }}-dev
            oaklight/veilrender:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Build and push gateway dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway
          platforms: linux/amd64
          push: true
          tags: |
            oaklight/veilrender:${{ inputs.version }}-dev-gateway
            oaklight/veilrender:dev-gateway
          cache-from: type=gha,scope=dev-gateway
          cache-to: type=gha,mode=max,scope=dev-gateway
