name: Deploy HF

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  deploy-hf:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - space_var: HF_SPACE
            title: VeilRender
          - space_var: HF_SPACE_PUBLIC
            title: VeilRender Public
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare HF Space files
        env:
          SPACE_TITLE: ${{ matrix.title }}
        run: |
          # Prepend HF frontmatter to README_en.md content
          {
            printf '%s\n' \
              '---' \
              "title: ${SPACE_TITLE}" \
              'emoji: 👻' \
              'colorFrom: gray' \
              'colorTo: purple' \
              'sdk: docker' \
              'app_port: 7860' \
              'pinned: false' \
              '---' \
              ''
            cat README_en.md
          } > README.hf.md

          # Replace README symlink with the combined file
          rm -f README.md README_en.md README_zh.md
          mv README.hf.md README.md

          # Remove non-essential files
          rm -rf .github .pre-commit-config.yaml CLAUDE.md Makefile BENCHMARK.md

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars[matrix.space_var] }}
        run: |
          if [ -z "$HF_SPACE" ]; then
            echo "::warning::${{ matrix.space_var }} variable not set, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy from GitHub $(git rev-parse --short HEAD@{1})" --allow-empty
          git push --force "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
